<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Gateway Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .nav {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            margin: 0 10px;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        textarea,
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #statusMessage {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="nav">
            <a href="/">New Message</a>
            <a href="/scheduled.html">Scheduled Messages</a>
            <a href="/contacts.html">Contacts</a>
        </div>
        <h1>Send Group Announcement</h1>
        <form id="smsForm">
            <div class="form-group" id="contactSelectorGroup" style="display: none;">
                <label for="contactSelector">Insert Contact/Group:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="contactSelector" style="flex: 1;"></select>
                    <button type="button" id="btnAddContact" style="width: auto;">Add</button>
                </div>
            </div>

            <div class="form-group">
                <label for="phoneNumbers">Phone Numbers (comma-separated or one per line):</label>
                <textarea id="phoneNumbers" rows="4" placeholder="+1234567890, +0987654321..." required></textarea>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" rows="5" placeholder="Type your announcement here..." required></textarea>
            </div>

            <div class="form-group">
                <label for="scheduledAt">Schedule for later (optional):</label>
                <input type="datetime-local" id="scheduledAt" name="scheduledAt">
            </div>

            <div class="form-group">
                <label for="recurring">Recurring Schedule:</label>
                <select id="recurring" name="recurring"
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box;">
                    <option value="none">None (One-time)</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Send Announcement</button>
        </form>

        <div id="statusMessage"></div>
    </div>

    <script src="app.js"></script>
</body>

</html>
