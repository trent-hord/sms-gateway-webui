<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SMS Gateway Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1,
        h2 {
            text-align: center;
            color: #333;
        }

        .nav {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            margin: 0 10px;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        .settings-panel {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="url"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .meta {
            color: #666;
            font-size: 13px;
            margin-top: 6px;
            word-break: break-word;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        #statusMessage {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav">
            <a href="/">New Message</a>
            <a href="/scheduled.html">Scheduled Messages</a>
            <a href="/contacts.html">Contacts</a>
            <a href="/webhooks.html">Webhooks</a>
            <a href="/history.html">History</a>
            <a href="/settings.html">Settings</a>
        </div>

        <h1>Settings</h1>

        <div class="settings-panel">
            <h2>Gateway</h2>
            <form id="settingsForm">
                <div class="form-group">
                    <label for="gatewayUrl">Gateway API URL</label>
                    <input type="url" id="gatewayUrl" placeholder="https://sms.hostedserver.cloud/3rdparty/v1" required>
                    <div id="gatewaySource" class="meta"></div>
                </div>

                <button type="submit" id="saveBtn">Save Settings</button>
            </form>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script src="settings.js"></script>
</body>

</html>
