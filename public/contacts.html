<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - SMS Gateway Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1,
        h2 {
            text-align: center;
            color: #333;
        }

        .nav {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            margin: 0 10px;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        .contact-card,
        .new-contact-form {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .new-contact-form {
            background: #eef7ff;
            border-color: #b8daff;
        }

        .contact-card h3 {
            margin-top: 0;
            color: #555;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        textarea,
        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            flex: 1;
        }

        .btn-add {
            background-color: #007bff;
            color: #fff;
        }

        .btn-add:hover {
            background-color: #0056b3;
        }

        .btn-save {
            background-color: #28a745;
            color: #fff;
        }

        .btn-save:hover {
            background-color: #218838;
        }

        .btn-delete {
            background-color: #dc3545;
            color: #fff;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        #statusMessage {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        #loading {
            text-align: center;
            color: #777;
            font-size: 16px;
        }

        .badge {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .badge-group {
            background-color: #e2e3e5;
            color: #383d41;
        }

        .badge-individual {
            background-color: #cce5ff;
            color: #004085;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="nav">
            <a href="/">New Message</a>
            <a href="/scheduled.html">Scheduled Messages</a>
            <a href="/contacts.html">Contacts</a>
            <a href="/history.html">History</a>
        </div>
        <h1>Manage Contacts & Groups</h1>

        <div id="statusMessage"></div>

        <div class="new-contact-form">
            <h2>Add New Contact / Group</h2>
            <div class="form-group">
                <label>Name (e.g., "John Doe" or "Marketing Team"):</label>
                <input type="text" id="newName" placeholder="Enter name...">
            </div>
            <div class="form-group">
                <label>Type:</label>
                <select id="newType">
                    <option value="individual">Individual</option>
                    <option value="group">Group</option>
                </select>
            </div>
            <div class="form-group">
                <label>Phone Numbers (comma or newline separated):</label>
                <textarea id="newPhones" rows="3" placeholder="+1234567890, +0987654321..."></textarea>
            </div>
            <button class="btn-add" onclick="addContact()">Add Contact / Group</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">

        <h2>Saved Contacts & Groups</h2>
        <div id="loading">Loading contacts...</div>
        <div id="contactsContainer"></div>
    </div>

    <script src="contacts.js"></script>
</body>

</html>
